<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatchLab · Sky Catcher</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1830;color:#eaf6ff;font-family:monospace}
    #unity-canvas{width:100%;height:100%;display:block;image-rendering:pixelated;outline:none}
    #loading{position:fixed;inset:0;display:grid;place-content:center;gap:20px;text-align:center;background:#0a1830}
    progress{width:280px;accent-color:#69baf3} #fullscreen{position:fixed;bottom:12px;right:12px;border:2px solid #69baf3;background:#0a1830cc;color:#eaf6ff;padding:9px;cursor:pointer}
    #fullscreen:hover,#fullscreen:focus{background:#215888} #fullscreen:active{transform:translateY(2px)}
    #error{position:fixed;bottom:60px;left:10%;width:80%;background:#431e24;padding:16px;display:none;white-space:pre-wrap}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="CatchLab game"></canvas>
  <div id="loading"><strong>CATCHLAB / SKY CATCHER</strong><span>กำลังโหลดเกม · Loading</span><progress id="progress" max="1" value="0"></progress></div>
  <button id="fullscreen" type="button" aria-label="เต็มหน้าจอ / Full screen">⛶</button>
  <div id="error" role="alert"></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas=document.getElementById('unity-canvas');
    const error=document.getElementById('error');
    const config={
      dataUrl:'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',
      companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
      productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner:(message,type)=>{ if(type==='error'){error.textContent=message;error.style.display='block';} }
    };
    createUnityInstance(canvas,config,value=>document.getElementById('progress').value=value).then(instance=>{
      document.getElementById('loading').style.display='none';
      document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);
      canvas.focus();
    }).catch(reason=>{error.textContent=String(reason);error.style.display='block';});
  </script>
</body>
</html>
